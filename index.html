<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>KTP Scanner Admin</title>
    <link rel="manifest" href="manifest.json">
    <script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script>
    <style>
        body { margin: 0; font-family: sans-serif; display: flex; flex-direction: column; height: 100vh; }
        #top-panel { flex: 1; background: #000; position: relative; overflow: hidden; }
        #bottom-panel { flex: 1; padding: 15px; overflow-y: auto; background: #f4f4f4; border-top: 2px solid #ccc; }
        video, canvas { width: 100%; height: 100%; object-fit: cover; }
        .input-group { margin-bottom: 10px; }
        input { width: 100%; padding: 8px; box-sizing: border-box; border: 1px solid #ddd; border-radius: 4px; }
        label { font-size: 12px; color: #666; font-weight: bold; }
        button { width: 100%; padding: 12px; background: #28a745; color: white; border: none; border-radius: 5px; font-weight: bold; margin-top: 10px; }
        #shutter { position: absolute; bottom: 20px; left: 50%; transform: translateX(-50%); width: 60px; height: 60px; background: white; border-radius: 50%; border: 5px solid rgba(0,0,0,0.3); }
    </style>
</head>
<body>

<div id="top-panel">
    <video id="video" autoplay playsinline></video>
    <canvas id="canvas" style="display:none;"></canvas>
    <div id="shutter"></div>
</div>

<div id="bottom-panel">
    <div class="input-group">
        <label>NIK</label>
        <input type="text" id="nik" placeholder="Hasil scan NIK...">
    </div>
    <div class="input-group">
        <label>NAMA LENGKAP</label>
        <input type="text" id="nama" placeholder="Hasil scan Nama...">
    </div>
    <div class="input-group">
        <label>ALAMAT (DUSUN/JL)</label>
        <input type="text" id="alamat" placeholder="Hasil scan Alamat...">
    </div>
    <div class="input-group">
        <label>DESA/KELURAHAN</label>
        <input type="text" id="desa" placeholder="Cari Desa...">
    </div>
    <!-- Field Kecamatan, Kota, Provinsi bisa di-auto-fill nanti -->
    <button id="btn-submit">SIMPAN KE SPREADSHEET</button>
</div>

<script src="app.js"></script>
</body>
</html>
