<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>KTP Scanner Admin</title>
    <!-- Memanggil Library Tesseract.js -->
    <script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script>
    <style>
        body { font-family: sans-serif; margin: 0; padding: 0; background: #f4f4f4; }
        .container { display: flex; flex-direction: column; height: 100vh; }
        
        /* Panel Atas: Kamera & Visual */
        #top-panel { flex: 1; position: relative; background: #000; overflow: hidden; }
        video, canvas#preview { width: 100%; height: 100%; object-fit: cover; }
        .overlay { 
            position: absolute; top: 50%; left: 50%; 
            transform: translate(-50%, -50%);
            width: 85%; height: 55%;
            border: 3px solid #00ff00; border-radius: 15px;
            box-shadow: 0 0 0 1000px rgba(0,0,0,0.6);
            pointer-events: none;
            z-index: 10;
        }

        /* Panel Bawah: Form Verifikasi */
        #bottom-panel { 
            flex: 1; padding: 20px; background: #fff; 
            overflow-y: auto; border-top-left-radius: 25px; 
            border-top-right-radius: 25px; box-shadow: 0 -5px 15px rgba(0,0,0,0.1);
        }
        .input-group { margin-bottom: 15px; }
        label { display: block; font-weight: bold; margin-bottom: 5px; color: #333; font-size: 14px; }
        input { 
            width: 100%; padding: 12px; border: 1px solid #ddd; 
            border-radius: 8px; box-sizing: border-box; font-size: 16px; 
            background: #f9f9f9;
        }
        input:focus { border-color: #28a745; outline: none; background: #fff; }
        
        .btn-container { display: flex; flex-direction: column; gap: 10px; margin-top: 10px; }
        button { 
            width: 100%; padding: 15px; border: none; border-radius: 12px; 
            font-size: 16px; font-weight: bold; cursor: pointer; transition: 0.3s;
        }
        #btn-scan { background: #007bff; color: white; }
        #btn-submit { background: #28a745; color: white; display: none; }
        button:disabled { background: #ccc; cursor: not-allowed; }
        
        #status-msg { text-align: center; font-size: 13px; margin-top: 12px; color: #777; font-style: italic; }
    </style>
</head>
<body>

<div class="container">
    <!-- LAYAR ATAS: KAMERA -->
    <div id="top-panel">
        <video id="video" autoplay playsinline></video>
        <canvas id="preview" style="display:none;"></canvas>
        <div class="overlay"></div>
    </div>

    <!-- LAYAR BAWAH: FORMULIR -->
    <div id="bottom-panel">
        <div class="input-group">
            <label>NIK (16 Digit)</label>
            <input type="text" id="nik" placeholder="Memindai NIK...">
        </div>
        <div class="input-group">
            <label>NAMA LENGKAP</label>
            <input type="text" id="nama" placeholder="Memindai Nama...">
        </div>
        <div class="input-group">
            <label>ALAMAT (DUSUN/JL)</label>
            <input type="text" id="alamat" placeholder="Input manual Alamat...">
        </div>
        <div class="input-group">
            <label>DESA/KELURAHAN</label>
            <input type="text" id="desa" placeholder="Input manual Desa...">
        </div>

        <div class="btn-container">
            <button id="btn-scan" onclick="captureAndScan()">AMBIL FOTO & PINDAI</button>
            <button id="btn-submit" onclick="submitToGAS()">SIMPAN KE SPREADSHEET</button>
        </div>
        <p id="status-msg">Siap bekerja. Posisikan KTP dalam kotak hijau.</p>
    </div>
</div>

<script>
    // URL WEB APP GAS ANDA
    const GAS_URL = "https://script.google.com/macros/s/AKfycbwKebiI0jRkDAJwY1IaYuxyfOrBdnHGJs4TAGcIHgvB844HxHzsio2GhwEJ32AOe_0ERQ/exec";
    
    const video = document.getElementById('video');
    const canvas = document.getElementById('preview');
    const statusMsg = document.getElementById('status-msg');

    // 1. Inisialisasi Kamera
    navigator.mediaDevices.getUserMedia({ video: { facingMode: "environment", width: 1280, height: 720 } })
        .then(stream => { video.srcObject = stream; })
        .catch(err => { 
            statusMsg.innerText = "Error Kamera: " + err;
            alert("Mohon izinkan akses kamera."); 
        });

    // 2. Fungsi Ambil Foto & Proses OCR
    async function captureAndScan() {
        const btnScan = document.getElementById('btn-scan');
        btnScan.disabled = true;
        statusMsg.innerText = "Mengolah gambar (Thresholding)...";

        const ctx = canvas.getContext('2d');
        canvas.width = video.videoWidth;
        canvas.height = video.videoHeight;
        ctx.drawImage(video, 0, 0, canvas.width, canvas.height);

        // PRE-PROCESSING: Hitam-Putih Murni agar Tesseract akurat
        let imageData = ctx.getImageData(0, 0, canvas.width, canvas.height);
        let pixels = imageData.data;
        for (let i = 0; i < pixels.length; i += 4) {
            let avg = (pixels[i] + pixels[i + 1] + pixels[i + 2]) / 3;
            let v = (avg < 125) ? 0 : 255; // Ambang batas filter
            pixels[i] = pixels[i + 1] = pixels[i + 2] = v;
        }
        ctx.putImageData(imageData, 0, 0);

        statusMsg.innerText = "Mengekstrak teks (OCR)...";

        try {
            const result = await Tesseract.recognize(canvas, 'ind');
            const fullText = result.data.text;
            console.log("Hasil OCR:", fullText);

            // REGEX: Mencari NIK (16 digit angka)
            const nikMatch = fullText.match(/\d{16}/);
            if (nikMatch) {
                document.getElementById('nik').value = nikMatch[0];
            }

            // REGEX: Mencari Nama (Mencari teks setelah kata 'Nama')
            const namaMatch = fullText.match(/Nama[\s:]+([^\n]+)/i);
            if (namaMatch) {
                document.getElementById('nama').value = namaMatch[1].trim().toUpperCase();
            }

            statusMsg.innerText = "Selesai. Silakan periksa kembali data di atas.";
            document.getElementById('btn-submit').style.display = "block";
        } catch (err) {
            statusMsg.innerText = "Gagal memindai: " + err;
            console.error(err);
        } finally {
            btnScan.disabled = false;
        }
    }

    // 3. Fungsi Kirim ke Google Sheets (GAS)
    async function submitToGAS() {
        const btnSubmit = document.getElementById('btn-submit');
        const data = {
            nik: document.getElementById('nik').value,
            nama: document.getElementById('nama').value,
            alamat_detail: document.getElementById('alamat').value,
            desa: document.getElementById('desa').value,
            kecamatan: "", 
            kota: "",
            provinsi: "",
            status: "Online"
        };

        if(!data.nik || !data.nama) {
            alert("NIK dan Nama tidak boleh kosong!");
            return;
        }

        btnSubmit.disabled = true;
        statusMsg.innerText = "Mengirim ke Spreadsheet...";

        try {
            // Mengirim data ke URL GAS Anda
            await fetch(GAS_URL, {
                method: "POST",
                mode: "no-cors",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify(data)
            });

            statusMsg.innerText = "SUKSES! Data tersimpan di Spreadsheet.";
            alert("Data Berhasil Disimpan!");
            
            // Reset Form untuk scan selanjutnya
            document.getElementById('nik').value = "";
            document.getElementById('nama').value = "";
            document.getElementById('alamat').value = "";
            document.getElementById('desa').value = "";
            btnSubmit.style.display = "none";
        } catch (err) {
            statusMsg.innerText = "Gagal mengirim data.";
            alert("Error saat mengirim ke GAS: " + err);
        } finally {
            btnSubmit.disabled = false;
        }
    }
</script>

</body>
</html>
