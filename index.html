<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>KTP Scanner Admin</title>
    <script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script>
    <style>
        body { font-family: sans-serif; margin: 0; padding: 0; background: #f4f4f4; }
        .container { display: flex; flex-direction: column; height: 100vh; }
        #top-panel { flex: 1; position: relative; background: #000; overflow: hidden; }
        video, canvas#preview { width: 100%; height: 100%; object-fit: cover; }
        .overlay { 
            position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
            width: 85%; height: 55%; border: 3px solid #00ff00; border-radius: 15px;
            box-shadow: 0 0 0 1000px rgba(0,0,0,0.6); pointer-events: none; z-index: 10;
        }
        #bottom-panel { 
            flex: 1; padding: 20px; background: #fff; overflow-y: auto; 
            border-top-left-radius: 25px; border-top-right-radius: 25px; 
        }
        .input-group { margin-bottom: 15px; }
        label { display: block; font-weight: bold; margin-bottom: 5px; color: #333; font-size: 14px; }
        input { 
            width: 100%; padding: 12px; border: 1px solid #ddd; border-radius: 8px; 
            box-sizing: border-box; font-size: 16px; background: #f9f9f9;
        }
        .btn-container { display: flex; flex-direction: column; gap: 10px; margin-top: 10px; }
        button { 
            width: 100%; padding: 15px; border: none; border-radius: 12px; 
            font-size: 16px; font-weight: bold; cursor: pointer;
        }
        #btn-scan { background: #007bff; color: white; }
        #btn-submit { background: #28a745; color: white; display: none; }
        #status-msg { text-align: center; font-size: 13px; margin-top: 12px; color: #777; }
    </style>
</head>
<body>

<div class="container">
    <div id="top-panel">
        <video id="video" autoplay playsinline></video>
        <canvas id="preview" style="display:none;"></canvas>
        <div class="overlay"></div>
    </div>

    <div id="bottom-panel">
        <div class="input-group"><label>NIK</label><input type="text" id="nik"></div>
        <div class="input-group"><label>NAMA LENGKAP</label><input type="text" id="nama"></div>
        <div class="input-group"><label>ALAMAT (DUSUN/JL)</label><input type="text" id="alamat"></div>
        <div class="input-group"><label>DESA/KELURAHAN</label><input type="text" id="desa"></div>

        <div class="btn-container">
            <button id="btn-scan" onclick="captureAndScan()">AMBIL FOTO & PINDAI</button>
            <button id="btn-submit" onclick="submitToGAS()">SIMPAN KE SPREADSHEET</button>
        </div>
        <p id="status-msg">Siap bekerja. Posisikan KTP dalam kotak hijau.</p>
    </div>
</div>

<script>
    const GAS_URL = "https://script.google.com/macros/s/AKfycbwKebiI0jRkDAJwY1IaYuxyfOrBdnHGJs4TAGcIHgvB844HxHzsio2GhwEJ32AOe_0ERQ/exec";
    const video = document.getElementById('video');
    const canvas = document.getElementById('preview');
    const statusMsg = document.getElementById('status-msg');

    navigator.mediaDevices.getUserMedia({ video: { facingMode: "environment" } })
        .then(stream => { video.srcObject = stream; });

    async function captureAndScan() {
        document.getElementById('btn-scan').disabled = true;
        statusMsg.innerText = "Memproses gambar...";
        const ctx = canvas.getContext('2d');
        canvas.width = video.videoWidth;
        canvas.height = video.videoHeight;
        ctx.drawImage(video, 0, 0, canvas.width, canvas.height);

        // Filter Hitam Putih
        let imageData = ctx.getImageData(0, 0, canvas.width, canvas.height);
        let pixels = imageData.data;
        for (let i = 0; i < pixels.length; i += 4) {
            let avg = (pixels[i] + pixels[i + 1] + pixels[i + 2]) / 3;
            let v = (avg < 125) ? 0 : 255;
            pixels[i] = pixels[i + 1] = pixels[i + 2] = v;
        }
        ctx.putImageData(imageData, 0, 0);

        statusMsg.innerText = "Mengekstrak data...";
        try {
            const result = await Tesseract.recognize(canvas, 'ind');
            const txt = result.data.text;

            // Logika Regex Otomatis
            const nik = txt.match(/\d{16}/);
            const nama = txt.match(/Nama[\s:]+([^\n]+)/i);
            const alamat = txt.match(/Alamat[\s:]+([^\n]+)/i);
            const desa = txt.match(/(?:Desa|Kelurahan|Kel\/Desa)[\s:]+([^\n]+)/i);

            if (nik) document.getElementById('nik').value = nik[0];
            if (nama) document.getElementById('nama').value = nama[1].trim().toUpperCase();
            if (alamat) document.getElementById('alamat').value = alamat[1].trim().toUpperCase();
            if (desa) document.getElementById('desa').value = desa[1].trim().toUpperCase();

            statusMsg.innerText = "Selesai. Silakan cek dan simpan.";
            document.getElementById('btn-submit').style.display = "block";
        } catch (e) { statusMsg.innerText = "Error: " + e; }
        document.getElementById('btn-scan').disabled = false;
    }

    async function submitToGAS() {
        const data = {
            nik: document.getElementById('nik').value,
            nama: document.getElementById('nama').value,
            alamat_detail: document.getElementById('alamat').value,
            desa: document.getElementById('desa').value,
            status: "Online"
        };
        statusMsg.innerText = "Menyimpan ke Spreadsheet...";
        await fetch(GAS_URL, { method: "POST", mode: "no-cors", body: JSON.stringify(data) });
        alert("Berhasil disimpan!");
        location.reload();
    }
</script>
</body>
</html>
